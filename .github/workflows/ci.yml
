name: AgroPulse-Sentinel Core Verification Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-system-logic:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repository Source Blocks
      uses: actions/checkout@v4

    - name: Initialize Isolated Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Inject Framework Test Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: Execute Deterministic Threat Suite Validation
      run: |
        pytest --cov=aps_core tests/ --cov-report=term-missing
